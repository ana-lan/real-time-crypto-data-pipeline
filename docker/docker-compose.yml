version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    # Official Confluent Zookeeper image — Confluent is the company
    # that maintains the most widely used Kafka distribution
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      # The port Zookeeper listens on for client connections (Kafka is the client)
      ZOOKEEPER_TICK_TIME: 2000
      # Heartbeat interval in milliseconds — how often Zookeeper checks
      # if connections are still alive
    ports:
      - "2181:2181"
      # host_port:container_port — exposes 2181 outside Docker

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
      # Kafka won't start until Zookeeper is running
    ports:
      - "9092:9092"
      # This is the port your Python producer connects to
    environment:
      KAFKA_BROKER_ID: 1
      # Unique ID for this broker — matters when you have multiple brokers
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Tells Kafka where Zookeeper is — uses the service name
      # 'zookeeper' because Docker's internal DNS resolves service names
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      # Two listeners:
      # INTERNAL on 29092 — for other containers talking to Kafka
      # EXTERNAL on 9092 — for your host machine (Python script, etc.)
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      # The address Kafka tells clients to connect to
      # localhost because your Python script runs on your host machine
      # What address Kafka tells clients to use after connecting:
      # Other containers get 'kafka:29092' (Docker DNS resolves 'kafka')
      # Host machine gets 'localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Both listeners use plain unencrypted traffic (fine for local dev)
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Brokers talk to each other on the INTERNAL listener
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # How many copies of internal metadata to keep
      # 1 is fine for local single-broker setup
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Automatically creates a topic when a producer first writes to it
      # We'll also create it manually for control
      KAFKA_LOG_RETENTION_HOURS: 24
      # How long Kafka keeps messages before deleting them
      # 24 hours is plenty for development

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
      # Open localhost:9000 in your browser to see the Kafka UI
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      # Kafdrop connects to Kafka using the internal Docker service name